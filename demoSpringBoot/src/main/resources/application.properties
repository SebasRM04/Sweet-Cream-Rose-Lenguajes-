# ── Servidor ────────────────────────────────────────────────────
server.port=8081

# ── Base de datos MySQL ─────────────────────────────────────────
# Los valores por defecto sirven para desarrollo local. En Docker,
# docker-compose.yml los sobreescribe con variables de entorno (SPRING_DATASOURCE_*).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reposteria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── CORS ────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:3000

# ── JWT ─────────────────────────────────────────────────────────
# la clave debe tener mínimo 256 bits (32 caracteres ASCII)
# para que Keys.hmacShaKeyFor() no lance WeakKeyException.
# El valor por defecto es solo para desarrollo local: en producción
# se debe definir JWT_SECRET como variable de entorno con una clave propia.
jwt.secret=${JWT_SECRET:SweetCreamRose-DEV-ONLY-clave-local-no-usar-en-produccion-2026}
# 24 horas en milisegundos
jwt.expiration=86400000
# 15 minutos en milisegundos (para token de reset de contraseña)
jwt.reset-expiration=900000

# ── PIN de administrador ─────────────────────────────────────────
# Valor de desarrollo. En producción definir ADMIN_PIN como variable de entorno.
# Se compara en AdminAuthController.
admin.pin=${ADMIN_PIN:SweetCream2024!}

# ── Logging ─────────────────────────────────────────────────────
logging.level.com.SweetCreamPink=INFO
logging.level.org.springframework.security=WARN

# Ruta de subida de imágenes. En Docker se sobreescribe con UPLOADS_DIRECTORY.
# El valor por defecto es relativo al proyecto para no depender de una ruta de Windows.
uploads.directory=${UPLOADS_DIRECTORY:./uploads/}

# Aumenta el límite de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Por si acaso: el conector Tomcat embebido también tiene su propio límite
server.tomcat.max-swallow-size=15MB

# ── Configuración de correo (Gmail SMTP) ───────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Credenciales SIEMPRE desde variables de entorno, nunca hardcodeadas aquí.
# Definir SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD (contraseña de aplicación
# de Gmail, no la contraseña normal de la cuenta) antes de levantar el backend.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Requerir STARTTLS y confiar en el host de Gmail
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ── URL base del frontend para armar el enlace de recuperación ──
app.frontend-url=http://localhost:3000

# ── Imágenes estáticas del catálogo (opcional, solo desarrollo local) ──
catalog.assets.directory=

# ── Actuator / Prometheus ───────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=sweetcream-backend

# ── Cron jobs (expresiones Spring: seg min hora día mes día-semana) ──
app.cron.desactivar-ofertas=0 0 0 * * *
app.cron.activar-ofertas=0 5 0 * * *
app.cron.limpiar-tokens=0 0 * * * *
app.cron.cancelar-pedidos=0 0 6 * * *
app.cron.dias-pedido-pendiente=7