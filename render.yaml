# Blueprint opcional. En Render: New -> Blueprint -> este repo.
# Las claves (sync: false) se piden al crear el blueprint; no quedan en Git.
services:
  - type: web
    name: sweetcream-backend
    runtime: docker
    plan: free
    rootDir: demoSpringBoot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  - type: web
    name: sweetcream-frontend
    runtime: static
    plan: free
    rootDir: frontend-pink-sweet
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: CI
        value: "false"
